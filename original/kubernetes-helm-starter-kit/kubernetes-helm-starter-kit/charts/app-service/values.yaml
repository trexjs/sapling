# nameOverride changes the short chart name used in generated resource names.
nameOverride: ""
# fullnameOverride replaces the full generated resource name. Use sparingly.
fullnameOverride: ""

replicaCount: 2

image:
  # repository is the full image name without a tag, e.g. ghcr.io/acme/web
  repository: nginxinc/nginx-unprivileged
  # tag should be pinned to an immutable version or digest for production.
  tag: "1.27-alpine"
  # pullPolicy controls when kubelet pulls the image.
  pullPolicy: IfNotPresent
  # pullSecrets is a list of pre-created image pull secret names.
  pullSecrets: []

serviceAccount:
  # create controls whether this chart creates a dedicated service account.
  create: true
  # name can pin a pre-existing service account name; empty uses generated name.
  name: ""
  # automountServiceAccountToken should remain false unless the app calls Kubernetes APIs.
  automountServiceAccountToken: false

# podAnnotations are additional annotations added to the Pod template.
podAnnotations: {}
# podLabels are extra labels added to the Pod template.
podLabels: {}

# containerPort is the port on which the application listens inside the container.
containerPort: 8080
# containerPortName names the container port for references such as probes.
containerPortName: http

service:
  # type is usually ClusterIP; expose public traffic through an ingress/gateway.
  type: ClusterIP
  # port is the stable in-cluster service port.
  port: 80
  # annotations are provider-specific service annotations.
  annotations: {}

# ingress requires an ingress controller and cluster-specific configuration.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: app.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # Example TLS:
  # tls:
  #   - secretName: app-example-com-tls
  #     hosts: [app.example.com]

# livenessProbe restarts a container that is stuck or unhealthy.
livenessProbe:
  enabled: true
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

# readinessProbe controls whether the Pod receives Service traffic.
readinessProbe:
  enabled: true
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 2
  failureThreshold: 3

# startupProbe gives slow-starting apps time before liveness/readiness checks run.
startupProbe:
  enabled: false
  httpGet:
    path: /
    port: http
  periodSeconds: 5
  failureThreshold: 30

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "500m"
    memory: 256Mi

autoscaling:
  # enabled requires metrics-server or a compatible metrics API.
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  # targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  # enabled protects availability during voluntary disruptions; it does not guarantee uptime.
  enabled: false
  minAvailable: 1
  # Alternative: maxUnavailable: 1 (do not set both)

# securityContext sets security defaults for the Pod.
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
# containerSecurityContext configures the application container.
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  # Set runAsUser/runAsGroup only when compatible with your image.
  runAsNonRoot: true

# env contains non-secret environment variables only.
env: []
# Example:
# env:
#   - name: NODE_ENV
#     value: production

# envFromConfigMaps and envFromSecrets reference existing objects. Do not commit secret values.
envFromConfigMaps: []
envFromSecrets: []

# extraVolumes and extraVolumeMounts are for advanced app-specific needs.
extraVolumes:
  - name: tmp
    emptyDir: {}
extraVolumeMounts:
  - name: tmp
    mountPath: /tmp

# nodeSelector, tolerations, affinity and topologySpreadConstraints are scheduling controls.
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

# terminationGracePeriodSeconds gives the app time to stop cleanly.
terminationGracePeriodSeconds: 30

# networkPolicy creates a restrictive ingress policy. Review DNS/egress needs before enabling.
networkPolicy:
  enabled: false
  # ingressFrom is a list of NetworkPolicy ingress peers. Empty means no ingress peers allowed.
  ingressFrom: []
  # egressTo is a list of NetworkPolicy egress peers. Empty means no egress peers allowed.
  egressTo: []
  # allowDNS enables UDP/TCP 53 egress to cluster DNS only if selectors are compatible with your cluster.
  allowDNS: false

# extraDeploy is intentionally not provided; use explicit templates for reviewable resources.
