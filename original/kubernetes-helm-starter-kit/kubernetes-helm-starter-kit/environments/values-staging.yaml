replicaCount: 2
image:
  repository: registry.example.com/team/app
  tag: "REPLACE_WITH_IMMUTABLE_TAG"
  pullPolicy: IfNotPresent
ingress:
  enabled: true
  className: nginx
  hosts:
    - host: app.staging.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: app-staging-tls
      hosts:
        - app.staging.example.com
autoscaling:
  enabled: false
podDisruptionBudget:
  enabled: true
  minAvailable: 1
