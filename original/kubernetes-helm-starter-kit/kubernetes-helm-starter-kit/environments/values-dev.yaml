# Development overrides. Replace the image repository/tag with your build output.
replicaCount: 1
image:
  repository: nginxinc/nginx-unprivileged
  tag: "1.27-alpine"
  pullPolicy: IfNotPresent
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi
ingress:
  enabled: false
autoscaling:
  enabled: false
podDisruptionBudget:
  enabled: false
