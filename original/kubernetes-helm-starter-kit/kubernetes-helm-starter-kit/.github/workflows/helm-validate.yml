name: Helm validation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Lint chart
        run: helm lint ./charts/app-service -f environments/values-dev.yaml
      - name: Render development manifests
        run: helm template ci ./charts/app-service --namespace ci -f environments/values-dev.yaml > rendered.yaml
