services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sapling
      POSTGRES_PASSWORD: sapling
      POSTGRES_DB: governance
    ports: ["5432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
  valkey:
    image: valkey/valkey:8-alpine
    ports: ["6379:6379"]
volumes:
  postgres:
