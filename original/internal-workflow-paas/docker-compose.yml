services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: flow, POSTGRES_PASSWORD: flow, POSTGRES_DB: flow }
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U flow"], interval: 5s, retries: 10 }
  valkey:
    image: valkey/valkey:8-alpine
    ports: ["6379:6379"]
    volumes: ["valkeydata:/data"]
volumes: { pgdata: {}, valkeydata: {} }
