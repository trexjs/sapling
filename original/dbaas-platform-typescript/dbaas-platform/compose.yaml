services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dbaas
      POSTGRES_PASSWORD: dbaas
      POSTGRES_DB: dbaas
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbaas"]
      interval: 5s
      retries: 15
volumes:
  pg_data:
